# Build speed optimizations
# JVM/Gradle Daemon configuration and optimizations
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseStringDeduplication
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=6

# Fix: Force in-process JVM compilation for compatibility with container environments and avoid daemon mode (required for some CI/build contexts)
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.incremental.android=true

# Android build optimizations
android.useAndroidX=true
android.debug.testCoverageEnabled=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
